<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'"><title>Профили браузера</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><p class="eyebrow">LOCAL CONTROL PLANE</p><h1>Профили браузера</h1></div><button id="new">Новый профиль</button></header><p id="notice" role="status"></p><section id="profiles" aria-label="Профили"></section></main><dialog id="editor"><form id="form"><h2>Настройка профиля</h2><input name="id" type="hidden"><input name="revision" type="hidden"><div class="grid"><label>Название<input name="name" required></label><label>Страна<input name="country_code" maxlength="2" required placeholder="KZ"></label><label>Timezone<input name="timezone" required placeholder="Asia/Almaty"></label><label>Locale<input name="locale" required placeholder="kk-KZ"></label><label>Languages<input name="languages" required placeholder="kk-KZ,kk"></label><label>CPU class<input name="cpu_class" required value="intel-8c-v1"></label><label>Ядра<select name="logical_cores"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></label><label>Память GiB<select name="memory_gib"><option>8</option><option selected>16</option><option>32</option><option>64</option></select></label><label>GPU class<input name="gpu_class" required value="intel-iris-xe-v1"></label><label>Proxy scheme<select name="proxy_scheme"><option value="">Без proxy</option><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks5">SOCKS5</option></select></label><label>Proxy host<input name="proxy_host"></label><label>Proxy port<input name="proxy_port" type="number" min="1" max="65535"></label></div><div id="errors"></div><footer><button type="button" id="cancel" class="secondary">Отмена</button><button type="submit">Сохранить</button></footer></form></dialog><script src="/app.js"></script></body></html>
